<div class="sidebar" [class.collapsed]="collapsed">
  <!-- Logo -->
  <div class="sb-logo">
    <div style="width:32px;height:32px;background:var(--t4);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <span style="color:var(--t8);font-size:16px;font-weight:900">M</span>
    </div>
    <div *ngIf="!collapsed" style="overflow:hidden">
      <div class="sb-logo-txt">SSM</div>
      <div class="sb-logo-sub">Memora Inovadores</div>
    </div>
  </div>

  <!-- Menu -->
  <div style="flex:1;overflow-y:auto;padding:8px">
    <div class="sb-item" (click)="toggleGroup()">
      <span class="sb-icon">🔄</span>
      <ng-container *ngIf="!collapsed">
        <span style="flex:1">Compartilhamento</span>
        <span class="sb-chevron" [class.open]="openGroup === 'compartilhamento'">▾</span>
      </ng-container>
    </div>

    <div class="sb-sub" [class.open]="!collapsed && openGroup === 'compartilhamento'">
      <div
        *ngFor="let item of menuItems"
        class="sb-sub-item"
        [class.active]="activeItem === item.id"
        [class.disabled]="item.dev"
        (click)="navigate(item)">
        <span>{{ item.icon }}</span>
        <span>{{ item.label }}</span>
        <span *ngIf="item.dev" style="font-size:9px;opacity:.5;margin-left:auto">em breve</span>
      </div>
    </div>
  </div>

  <!-- Recolher -->
  <div class="sb-collapse">
    <div class="sb-item" (click)="collapseToggle.emit()">
      <span class="sb-icon">{{ collapsed ? '▶' : '◀' }}</span>
      <span *ngIf="!collapsed">Recolher</span>
    </div>
  </div>
</div>
