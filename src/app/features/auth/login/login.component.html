<div class="login-wrap">
  <div class="login-card">
    <div style="text-align:center;margin-bottom:28px">
      <div style="width:56px;height:56px;background:var(--t6);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
        <span style="color:white;font-size:24px;font-weight:900">M</span>
      </div>
      <div style="font-size:22px;font-weight:900;color:var(--g8)">SSM</div>
      <div style="font-size:13px;color:var(--g4)">Memora Processos Inovadores</div>
    </div>

    <div style="margin-bottom:16px">
      <label class="fl">Selecionar usuário (piloto)</label>
      <select class="fi" [(ngModel)]="selectedId">
        <option [ngValue]="null">-- Selecione --</option>
        <option *ngFor="let u of usuarios" [ngValue]="u.id">
          {{ u.nome }} — {{ u.cargo }}
        </option>
      </select>
    </div>

    <button class="bp"
      style="width:100%;justify-content:center;font-size:15px"
      [disabled]="!selectedId"
      (click)="login()">
      Entrar no Sistema
    </button>

    <div style="margin-top:16px;padding:12px 14px;background:var(--orbg);border-radius:10px;font-size:11px;color:#92400e">
      <strong>Modo Piloto</strong> — Selecione um perfil para simular diferentes visibilidades no sistema.
    </div>
  </div>
</div>
